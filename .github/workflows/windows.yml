# The Windows smoke test: everything a Windows user's machine would do, on a
# clean windows-latest runner — resolve the Python env, use a compatible
# system-PATH ffmpeg without copying it into ClipGauge data, pass the full
# pipeline test suite, build the NSIS installer, install it silently, and
# launch the real installed app.
# The Windows install guide stays honest only while this stays green.
name: windows

on:
  push:
    branches: [main, win-port]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Keep every cache/download inside the workspace so nothing collides
      # with other jobs on a shared runner image.
      CLIPGAUGE_HOME: ${{ github.workspace }}\.clipgauge-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Resolve the pipeline env (uv sync on Windows)
        working-directory: pipeline
        run: uv sync

      - name: Provide compatible system FFmpeg on PATH
        working-directory: pipeline
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            choco install ffmpeg -y --no-progress
            $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          }
          Write-Host "system FFmpeg: $($ffmpeg.Source)"
          uv run python -c "from clipgauge_pipeline.render import ffmpeg_bin; d = ffmpeg_bin.readiness(); print(d.to_dict()); assert d.ready and d.source == 'system' and not d.managed_download_needed, 'system FFmpeg was not reused'"

      - name: Pipeline test suite on Windows
        working-directory: pipeline
        run: uv run pytest -q

      - name: Build the app + NSIS installer
        working-directory: app
        run: |
          npm ci
          npm run build
          npm test
          npx tauri build --bundles nsis

      - name: Install silently and launch the installed app
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer produced" }
          Write-Host "installer: $($setup.Name)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $nativeHome = Join-Path $env:USERPROFILE ".clipgauge"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $nativeHome
          New-Item -ItemType Directory -Force $nativeHome | Out-Null
          New-Item -ItemType File -Force (Join-Path $nativeHome "onboarded") | Out-Null
          $dir = Join-Path $env:LOCALAPPDATA "ClipGauge"
          if (-not (Test-Path $dir)) { throw "install dir missing: $dir" }
          $exe = Get-ChildItem $dir -Filter *.exe |
            Where-Object { $_.Name -notmatch "uninstall" } |
            Select-Object -First 1
          if (-not $exe) { throw "no app exe under $dir" }
          Write-Host "launching $($exe.FullName)"
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 15
          $proc = Get-Process -Name $exe.BaseName -ErrorAction Stop
          Write-Host "app alive after 15s (pid $($proc.Id))"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\\windows-screenshots" | Out-Null
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class ClipGaugeWindowCapture {
            [DllImport("user32.dll")] public static extern bool MoveWindow(IntPtr hWnd, int X, int Y, int nWidth, int nHeight, bool bRepaint);
            [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint nFlags);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int X, int Y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo);
            public static void Click(int x, int y) {
              SetCursorPos(x, y);
              mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
              mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
            }
          }
          "@
          $proc.Refresh()
          $hwnd = $proc.MainWindowHandle
          if ($hwnd -eq [IntPtr]::Zero) { throw "installed ClipGauge window handle unavailable" }
          foreach ($size in @(@{name="1366x768"; width=1366; height=768}, @{name="1920x1080"; width=1920; height=1080})) {
            [ClipGaugeWindowCapture]::MoveWindow($hwnd, 0, 0, $size.width, $size.height, $true) | Out-Null
            [ClipGaugeWindowCapture]::SetForegroundWindow($hwnd) | Out-Null
            Start-Sleep -Seconds 2
            [ClipGaugeWindowCapture]::Click(100, 309)
            Start-Sleep -Seconds 3
            $bitmap = New-Object System.Drawing.Bitmap -ArgumentList $size.width, $size.height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            $hdc = $graphics.GetHdc()
            try {
              if (-not [ClipGaugeWindowCapture]::PrintWindow($hwnd, $hdc, 2)) { throw "PrintWindow failed for $($size.name)" }
            } finally {
              $graphics.ReleaseHdc($hdc)
              $graphics.Dispose()
            }
            $bitmap.Save((Join-Path "$env:GITHUB_WORKSPACE\\windows-screenshots" "setup-$($size.name).png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $bitmap.Dispose()
            [System.Windows.Forms.SendKeys]::SendWait("{END}")
            Start-Sleep -Seconds 2
            $localBitmap = New-Object System.Drawing.Bitmap -ArgumentList $size.width, $size.height
            $localGraphics = [System.Drawing.Graphics]::FromImage($localBitmap)
            $localHdc = $localGraphics.GetHdc()
            try {
              if (-not [ClipGaugeWindowCapture]::PrintWindow($hwnd, $localHdc, 2)) { throw "PrintWindow failed for local-AI $($size.name)" }
            } finally {
              $localGraphics.ReleaseHdc($localHdc)
              $localGraphics.Dispose()
            }
            $localBitmap.Save((Join-Path "$env:GITHUB_WORKSPACE\\windows-screenshots" "local-ai-$($size.name).png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $localBitmap.Dispose()
            [ClipGaugeWindowCapture]::Click(100, 356)
            Start-Sleep -Seconds 3
            $providerBitmap = New-Object System.Drawing.Bitmap -ArgumentList $size.width, $size.height
            $providerGraphics = [System.Drawing.Graphics]::FromImage($providerBitmap)
            $providerHdc = $providerGraphics.GetHdc()
            try {
              if (-not [ClipGaugeWindowCapture]::PrintWindow($hwnd, $providerHdc, 2)) { throw "PrintWindow failed for providers $($size.name)" }
            } finally {
              $providerGraphics.ReleaseHdc($providerHdc)
              $providerGraphics.Dispose()
            }
            $providerBitmap.Save((Join-Path "$env:GITHUB_WORKSPACE\\windows-screenshots" "providers-$($size.name).png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $providerBitmap.Dispose()
          }
          Stop-Process -Id $proc.Id -Force
      - uses: actions/upload-artifact@v4

        with:
          name: clipgauge-windows-setup
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            windows-screenshots/*.png
          if-no-files-found: error
