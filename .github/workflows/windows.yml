# The Windows smoke test: everything a Windows user's machine would do, on a
# clean windows-latest runner — resolve the Python env, use a compatible
# system-PATH ffmpeg without copying it into ClipGauge data, pass the full
# pipeline test suite, build the NSIS installer, install it silently, and
# launch the real installed app.
# The Windows install guide stays honest only while this stays green.
name: windows

on:
  push:
    branches: [main, win-port]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Keep every cache/download inside the workspace so nothing collides
      # with other jobs on a shared runner image.
      CLIPGAUGE_HOME: ${{ github.workspace }}\.clipgauge-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: microsoft/setup-WinAppCli@v0.1

      - name: Install deterministic WebView2 automation dependency
        working-directory: .github
        run: npm install --no-save --no-package-lock playwright-core@1.62.1

      - name: Resolve the pipeline env (uv sync on Windows)
        working-directory: pipeline
        run: uv sync

      - name: Provide compatible system FFmpeg on PATH
        working-directory: pipeline
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if (-not $ffmpeg) {
            choco install ffmpeg -y --no-progress
            $ffmpeg = Get-Command ffmpeg -ErrorAction Stop
          }
          Write-Host "system FFmpeg: $($ffmpeg.Source)"
          uv run python -c "from clipgauge_pipeline.render import ffmpeg_bin; d = ffmpeg_bin.readiness(); print(d.to_dict()); assert d.ready and d.source == 'system' and not d.managed_download_needed, 'system FFmpeg was not reused'"

      - name: Pipeline test suite on Windows
        working-directory: pipeline
        run: uv run pytest -q

      - name: Build the app + NSIS installer
        working-directory: app
        run: |
          npm ci
          npm run build
          npm test
          npx tauri build --bundles nsis

      - name: Install required creator assets for truthful Setup Ready state
        working-directory: pipeline
        shell: pwsh
        run: |
          $env:HOME = $env:USERPROFILE
          $nativeHome = Join-Path $env:USERPROFILE ".clipgauge"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $nativeHome
          New-Item -ItemType Directory -Force $nativeHome | Out-Null
          New-Item -ItemType File -Force (Join-Path $nativeHome "onboarded") | Out-Null
          $env:CLIPGAUGE_HOME = $nativeHome
          uv run clipgauge --jsonl setup install-group --group core:asr | Tee-Object "$env:GITHUB_WORKSPACE\setup-asr.jsonl"
          if ($LASTEXITCODE -ne 0) { throw "ASR setup failed with exit code $LASTEXITCODE" }
          uv run clipgauge --jsonl setup install-group --group core:analysis | Tee-Object "$env:GITHUB_WORKSPACE\setup-analysis.jsonl"
          if ($LASTEXITCODE -ne 0) { throw "analysis setup failed with exit code $LASTEXITCODE" }

      - name: Install silently and run deterministic packaged Windows UI qualification
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer produced" }
          Write-Host "installer: $($setup.Name)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $env:HOME = $env:USERPROFILE
          $nativeHome = Join-Path $env:USERPROFILE ".clipgauge"
          New-Item -ItemType Directory -Force $nativeHome | Out-Null
          New-Item -ItemType File -Force (Join-Path $nativeHome "onboarded") | Out-Null
          $dir = Join-Path $env:LOCALAPPDATA "ClipGauge"
          if (-not (Test-Path $dir)) { throw "install dir missing: $dir" }
          $resources = Join-Path $dir "resources"
          $uv = Join-Path $resources "bin\uv.exe"
          $pipeline = Join-Path $resources "pipeline"
          if (-not (Test-Path $uv)) { throw "bundled uv missing: $uv" }
          if (-not (Test-Path $pipeline)) { throw "bundled pipeline missing: $pipeline" }
          $env:CLIPGAUGE_HOME = $nativeHome
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $nativeHome "runtimes\pipeline"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\windows-screenshots" | Out-Null
          & $uv --directory $pipeline sync --locked
          if ($LASTEXITCODE -ne 0) { throw "bundled pipeline bootstrap failed with exit code $LASTEXITCODE" }
          $inventory = (& $uv --directory $pipeline run clipgauge setup inventory --model "clipgauge-local/qwen3-4b-q4_k_m" | Out-String | ConvertFrom-Json)
          if (-not $inventory.video_tools.ready) { throw "packaged Setup inventory did not report FFmpeg ready" }
          if ($inventory.video_tools.source -ne "system") { throw "packaged Setup inventory did not reuse system FFmpeg" }
          if ($inventory.video_tools.managed_download_needed) { throw "packaged Setup inventory incorrectly requires managed FFmpeg download" }
          if (-not $inventory.video_tools.capabilities.subtitles) { throw "packaged Setup inventory did not report subtitles capability" }
          $inventory | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 (Join-Path "$env:GITHUB_WORKSPACE\windows-screenshots" "setup-inventory.json")
          $sentinel = "clipgauge-qa-sentinel-20260824"
          $env:CLIPGAUGE_QA_OPENROUTER_ENDPOINT = "http://127.0.0.1:8765/v1"
          $fixture = Start-Process -FilePath "python" -ArgumentList @("scripts/qa_provider_fixture.py", "--port", "8765") -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $fixtureResponse = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/v1/models"
            if ($fixtureResponse.StatusCode -ne 200) { throw "QA provider fixture did not start" }
            $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
            if (-not $exe) { throw "no app exe under $dir" }
            & "$env:GITHUB_WORKSPACE\.github\windows-ui-qualification.ps1" -AppPath $exe.FullName -OutputDir "$env:GITHUB_WORKSPACE\windows-screenshots" -Sentinel $sentinel
            if ($LASTEXITCODE -ne 0) { throw "deterministic Windows UI qualification failed with exit code $LASTEXITCODE" }
          } finally {
            if ($fixture -and -not $fixture.HasExited) { Stop-Process -Id $fixture.Id -Force }
            Remove-Item Env:CLIPGAUGE_QA_OPENROUTER_ENDPOINT -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v4

        with:
          name: clipgauge-windows-setup
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            windows-screenshots/*.png
            windows-screenshots/*.json
            setup-asr.jsonl
            setup-analysis.jsonl
            .github/windows-ui-qualification.ps1
            .github/windows-ui-qualification.mjs
            scripts/qa_provider_fixture.py
          if-no-files-found: error
