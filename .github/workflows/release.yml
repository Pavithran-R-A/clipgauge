name: Release ClipGauge

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing immutable release tag to package and publish"
        required: true
        default: "v0.1.1"
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag and versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Enforce tag/version equality
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          manifest_version=$(python3 -c 'import json; print(json.load(open("app/package.json"))["version"])')
          test "$RELEASE_TAG" = "v${manifest_version}"
          test "$tag_version" = "$manifest_version"
      - name: Run version consistency check
        run: python3 scripts/check-version-consistency.py
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - name: Check first-party visual assets
        run: uv run --project pipeline --with 'pillow>=12.3' python scripts/check-first-party-visual-assets.py --self-test && uv run --project pipeline --with 'pillow>=12.3' python scripts/check-first-party-visual-assets.py

  linux-release:
    name: Build unsigned Linux amd64 Debian package
    needs: validate-tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux prerequisites
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build unsigned Debian package from exact tag
        working-directory: app
        run: npm run tauri build -- --bundles deb
      - name: Inspect package metadata and stage immutable artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          package=$(find app/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          dpkg-deb --info "$package" | tee release-assets/linux-deb-info.txt
          dpkg-deb --contents "$package" > release-assets/linux-deb-contents.txt
          cp "$package" "release-assets/ClipGauge_${RELEASE_TAG#v}_amd64.deb"
          test "$(dpkg-deb --field "$package" Version)" = "${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: clipgauge-linux-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  windows-release:
    name: Build unsigned Windows x64 NSIS installer
    needs: validate-tag
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CLIPGAUGE_HOME: ${{ github.workspace }}\.clipgauge-home
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Resolve the pipeline environment
        working-directory: pipeline
        run: uv sync --dev
      - name: Fetch caption-capable FFmpeg
        working-directory: pipeline
        shell: pwsh
        run: |
          $success = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Fetching caption-capable FFmpeg (attempt $attempt/3)"
            uv run python -c "from clipgauge_pipeline.render import ffmpeg_bin; ok = ffmpeg_bin.ensure_capable(); print('resolved:', ffmpeg_bin.resolve()); assert ok, 'no subtitles-capable ffmpeg on Windows'"
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }
            # A failed integrity check leaves only a resumable .part file. Do
            # not resume a corrupted archive on the next attempt.
            $partial = Join-Path $env:CLIPGAUGE_HOME "bin\.ffmpeg-static.zip.part"
            Remove-Item -Force -ErrorAction SilentlyContinue $partial
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $success) { throw "caption-capable FFmpeg could not be fetched after three verified attempts" }
          Add-Content $env:GITHUB_ENV "CLIPGAUGE_FFMPEG=$env:CLIPGAUGE_HOME\bin\ffmpeg.exe"
      - name: Run Windows pipeline tests
        working-directory: pipeline
        run: uv run pytest -q
      - name: Install frontend dependencies and run frontend gates
        working-directory: app
        run: |
          npm ci
          npm run build
          npm test
      - name: Prepare Tauri resource directory for Rust checks
        working-directory: app/src-tauri
        shell: pwsh
        run: New-Item -ItemType Directory -Force resources | Out-Null
      - name: Run Rust checks where practical
        working-directory: app/src-tauri
        run: |
          cargo fmt -- --check
          cargo test
          cargo clippy --all-targets --all-features -- -D warnings
      - name: Build fresh NSIS installer from exact tag
        working-directory: app
        run: npx tauri build --bundles nsis
      - name: Silent install, inspect, and launch installed ClipGauge
        shell: pwsh
        run: |
          $setup = Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer produced" }
          $version = "${env:RELEASE_TAG}".Substring(1)
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $publicName = "ClipGauge_${version}_Windows_x64_NSIS.exe"
          Copy-Item $setup.FullName (Join-Path $releaseDir $publicName)
          Write-Host "installer: $($setup.Name) -> $publicName"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "ClipGauge"
          if (-not (Test-Path $dir)) { throw "install dir missing: $dir" }
          $exe = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          if (-not $exe) { throw "no app exe under $dir" }
          Start-Process -FilePath $exe.FullName
          Start-Sleep -Seconds 15
          $proc = Get-Process -Name $exe.BaseName -ErrorAction Stop
          Write-Host "ClipGauge process alive after launch smoke: pid $($proc.Id)"
          Stop-Process -Id $proc.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: clipgauge-windows-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  macos-release:
    name: Native macOS ${{ matrix.arch }} qualification
    needs: validate-tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    permissions:
      contents: read
    env:
      CLIPGAUGE_HOME: ${{ github.workspace }}/.clipgauge-home
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Install deterministic media prerequisite
        run: |
          brew untap aws/tap || true
          brew install ffmpeg-full
          if [ -x /opt/homebrew/opt/ffmpeg-full/bin/ffmpeg ]; then
            echo "CLIPGAUGE_FFMPEG=/opt/homebrew/opt/ffmpeg-full/bin/ffmpeg" >> "$GITHUB_ENV"
          elif [ -x /usr/local/opt/ffmpeg-full/bin/ffmpeg ]; then
            echo "CLIPGAUGE_FFMPEG=/usr/local/opt/ffmpeg-full/bin/ffmpeg" >> "$GITHUB_ENV"
          else
            echo "ffmpeg-full binary not found" >&2
            exit 1
          fi
      - name: Resolve Python environment and run tests
        working-directory: pipeline
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            # The locked ML stack has no Intel macOS wheels. Install only the
            # compatible dependencies needed by deterministic test modules.
            uv venv --python 3.12 .venv
            uv pip install --python .venv/bin/python pytest httpx 'librosa==0.10.2.post1' 'numba==0.60.0' numpy scipy scikit-learn yt-dlp python-speech-features
            PYTHONPATH="$GITHUB_WORKSPACE/pipeline" .venv/bin/python -c "from clipgauge_pipeline.render import ffmpeg_bin; path, captions = ffmpeg_bin.resolve(); print(path, captions); assert captions"
            PYTHONPATH="$GITHUB_WORKSPACE/pipeline" .venv/bin/pytest -q
          else
            uv sync --dev
            uv run python -c "from clipgauge_pipeline.render import ffmpeg_bin; path, captions = ffmpeg_bin.resolve(); print(path, captions); assert captions"
            uv run pytest -q
          fi
      - name: Run frontend build and tests
        working-directory: app
        run: |
          npm ci
          npm run build
          npm test
      - name: Run Rust checks
        working-directory: app/src-tauri
        run: |
          mkdir -p resources
          cargo fmt -- --check
          # Run the complete target test suite; fixture-dependent artifact tests must remain release-visible.
          cargo test --target "${{ matrix.target }}"
          cargo clippy --target "${{ matrix.target }}" --all-targets --all-features -- -D warnings
      - name: Build unsigned macOS app qualification artifact
        working-directory: app
        run: |
          node scripts/prepare-resources.mjs
          npm run tauri build -- --target "${{ matrix.target }}" --bundles app
      - name: Inspect app bundle identity and resources
        shell: bash
        run: |
          set -euo pipefail
          app_bundle=$(find "app/src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_bundle"
          plist="$app_bundle/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "io.github.pavithranra.clipgauge"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "${RELEASE_TAG#v}"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          test -x "$app_bundle/Contents/MacOS/$executable"
          find "$app_bundle/Contents/Resources" -path '*clipgauge_pipeline*' -print -quit | grep .
      - name: Attempt unsigned DMG qualification
        continue-on-error: true
        working-directory: app
        run: npm run tauri build -- --target "${{ matrix.target }}" --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: clipgauge-macos-${{ matrix.arch }}-${{ github.sha }}
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  model-e2e-release:
    name: Production-default model-backed E2E
    needs: validate-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      CLIPGAUGE_HOME: ${{ github.workspace }}/.clipgauge-home
      CLIPGAUGE_FFMPEG: /usr/bin/ffmpeg
      HF_HUB_DISABLE_TELEMETRY: '1'
      TRANSFORMERS_VERBOSITY: error
      CLIPGAUGE_QA_RUNTIME_TRACE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Install deterministic media prerequisite
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y ffmpeg
      - name: Resolve full pipeline environment
        working-directory: pipeline
        run: uv sync --dev
      - name: Install verified model assets with bounded retries
        working-directory: pipeline
        shell: bash
        run: |
          set -euo pipefail
          install_verified() {
            local label="$1"
            local log_path="$2"
            shift 2
            local delay=15
            for attempt in 1 2 3 4; do
              echo "Installing verified $label (attempt $attempt/4)"
              if "$@" | tee "$GITHUB_WORKSPACE/$log_path"; then
                return 0
              fi
              if [ "$attempt" -eq 4 ]; then
                return 1
              fi
              echo "Retrying $label in ${delay}s"
              sleep "$delay"
              delay=$((delay * 2))
            done
          }

          install_verified "ASR assets" setup-asr.jsonl \
            uv run clipgauge --jsonl setup install-group --group core:asr
          install_verified "analysis assets" setup-analysis.jsonl \
            uv run clipgauge --jsonl setup install-group --group core:analysis
          install_verified "local runtime" setup-runtime.jsonl \
            uv run clipgauge --jsonl setup install-runtime
          install_verified "local model" setup-model.jsonl \
            uv run clipgauge --jsonl setup download-model clipgauge-local/qwen3-4b-q4_k_m
      - name: Build the controlled speech acceptance input
        working-directory: pipeline
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e-input"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i anullsrc=r=16000:cl=mono:d=1 \
            -f lavfi -i "flite=text='Why did our payment launch fail moments before release? Every customer order was rejected, placing the entire company at risk.':voice=slt" \
            -f lavfi -i "flite=text='Engineers traced the outage to one expired security certificate that silently blocked every payment.':voice=slt" \
            -f lavfi -i "flite=text='After replacing the certificate and testing checkout, every order succeeded. The recovered launch saved the company, and the final fix worked.':voice=slt" \
            -filter_complex "[0:a]aresample=16000,aformat=sample_fmts=s16:channel_layouts=mono,asplit=2[silence1][silence2];[1:a]aresample=16000,aformat=sample_fmts=s16:channel_layouts=mono[story1];[2:a]aresample=16000,aformat=sample_fmts=s16:channel_layouts=mono[story2];[3:a]aresample=16000,aformat=sample_fmts=s16:channel_layouts=mono[story3];[story1][silence1][story2][silence2][story3]concat=n=5:v=0:a=1[out]" \
            -map "[out]" -ar 16000 -ac 1 -c:a flac \
            "$GITHUB_WORKSPACE/e2e-input/acceptance.flac"
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=0x182033:s=1280x720:r=30 \
            -i "$GITHUB_WORKSPACE/e2e-input/acceptance.flac" \
            -t 36 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -ar 16000 -shortest \
            "$GITHUB_WORKSPACE/e2e-input/v041-controlled.mp4"
      - name: Run the real production-default pipeline
        working-directory: pipeline
        run: |
          set -euo pipefail

          memory_log="$GITHUB_WORKSPACE/model-e2e-memory.log"
          event_log="$GITHUB_WORKSPACE/model-e2e.jsonl"
          : > "$memory_log"

          meminfo_value() {
            awk -v key="$1:" '$1 == key { print $2; exit }' /proc/meminfo 2>/dev/null || true
          }

          sc_avphys_bytes() {
            local pages page_size
            pages=$(getconf _AVPHYS_PAGES 2>/dev/null || true)
            page_size=$(getconf PAGE_SIZE 2>/dev/null || true)
            if [[ "$pages" =~ ^[0-9]+$ && "$page_size" =~ ^[0-9]+$ ]]; then
              printf '%s' "$((pages * page_size))"
            else
              printf 'unknown'
            fi
          }

          cgroup_memory_value() {
            local name="$1"
            local suffix v2_path v1_path v1_name
            suffix=$(awk -F: '$1 == "0" { print $3; exit }' /proc/self/cgroup 2>/dev/null || true)
            v2_path="/sys/fs/cgroup${suffix}/${name}"
            if [ -r "$v2_path" ]; then
              cat "$v2_path"
              return
            fi
            suffix=$(awk -F: '$2 == "memory" { print $3; exit }' /proc/self/cgroup 2>/dev/null || true)
            case "$name" in
              memory.max) v1_name="memory.limit_in_bytes" ;;
              memory.current) v1_name="memory.usage_in_bytes" ;;
              *) printf 'unknown'; return ;;
            esac
            v1_path="/sys/fs/cgroup/memory${suffix}/${v1_name}"
            if [ -r "$v1_path" ]; then
              cat "$v1_path"
            else
              printf 'unknown'
            fi
          }

          process_tree() {
            local root_pid="$1"
            ps -eo pid=,ppid= 2>/dev/null | awk -v root="$root_pid" '
              { pid[++count] = $1; parent[$1] = $2 }
              function visit(current, i) {
                print current
                for (i = 1; i <= count; i++) {
                  if (parent[pid[i]] == current) visit(pid[i])
                }
              }
              END { visit(root) }
            '
          }

          process_field() {
            local pid="$1"
            local field="$2"
            awk -v key="$field:" '$1 == key { print $2; exit }' "/proc/$pid/smaps_rollup" 2>/dev/null || printf 'unknown'
          }

          model_mapping_kb() {
            local pid="$1"
            awk '
              /^[0-9a-f]+-[0-9a-f]+/ { model = ($0 ~ /models|\\.(gguf|pth|bin)( |$)/); next }
              model && $1 == "Rss:" { total += $2 }
              END { print total + 0 }
            ' "/proc/$pid/smaps" 2>/dev/null || printf 'unknown'
          }

          snapshot() {
            local phase="$1"
            local root_pid="${2:-unknown}"
            local now stage event sc_avphys_pages sc_avphys_page_size sc_avphys
            now=$(date --iso-8601=seconds)
            sc_avphys_pages=$(getconf _AVPHYS_PAGES 2>/dev/null || true)
            sc_avphys_page_size=$(getconf PAGE_SIZE 2>/dev/null || true)
            sc_avphys=$(sc_avphys_bytes)
            stage="unknown"
            event="unknown"
            if [ -f "$event_log" ]; then
              stage=$(grep -o '"stage": "[^"]*"' "$event_log" | tail -n 1 | cut -d'"' -f4 || true)
              event=$(grep -o '"event": "[^"]*"' "$event_log" | tail -n 1 | cut -d'"' -f4 || true)
              stage=${stage:-unknown}
              event=${event:-unknown}
            fi
            {
              printf 'snapshot|time=%s|phase=%s|event=%s|stage=%s|root_pid=%s|mem_total_kb=%s|mem_available_kb=%s|mem_free_kb=%s|sc_avphys_pages=%s|sc_avphys_page_size_bytes=%s|sc_avphys_bytes=%s|buffers_kb=%s|cached_kb=%s|sreclaimable_kb=%s|swap_total_kb=%s|swap_free_kb=%s|commit_limit_kb=%s|committed_as_kb=%s|cgroup_memory_max=%s|cgroup_memory_current=%s\n' \
                "$now" "$phase" "$event" "$stage" "$root_pid" \
                "$(meminfo_value MemTotal)" "$(meminfo_value MemAvailable)" "$(meminfo_value MemFree)" \
                "$sc_avphys_pages" "$sc_avphys_page_size" "$sc_avphys" \
                "$(meminfo_value Buffers)" "$(meminfo_value Cached)" "$(meminfo_value SReclaimable)" \
                "$(meminfo_value SwapTotal)" "$(meminfo_value SwapFree)" "$(meminfo_value CommitLimit)" \
                "$(meminfo_value Committed_AS)" "$(cgroup_memory_value memory.max)" "$(cgroup_memory_value memory.current)"
              for pid in $(process_tree "$root_pid"); do
                [ -r "/proc/$pid/status" ] || continue
                ppid=$(awk '/^PPid:/ { print $2; exit }' "/proc/$pid/status" 2>/dev/null || printf 'unknown')
                comm=$(cat "/proc/$pid/comm" 2>/dev/null || printf 'unknown')
                printf 'process|time=%s|phase=%s|stage=%s|pid=%s|ppid=%s|comm=%s|rss_kb=%s|pss_kb=%s|shared_clean_kb=%s|private_dirty_kb=%s|model_mapping_rss_kb=%s\n' \
                  "$now" "$phase" "$stage" "$pid" "$ppid" "$comm" \
                  "$(process_field "$pid" Rss)" "$(process_field "$pid" Pss)" \
                  "$(process_field "$pid" Shared_Clean)" "$(process_field "$pid" Private_Dirty)" \
                  "$(model_mapping_kb "$pid")"
              done
            } >> "$memory_log"
          }

          snapshot before_pipeline
          uv run clipgauge --jsonl run "$GITHUB_WORKSPACE/e2e-input/v041-controlled.mp4" \
            --provider clipgauge-local \
            --model clipgauge-local/qwen3-4b-q4_k_m \
            > "$event_log" 2>&1 &
          pipeline_pid=$!
          (
            while kill -0 "$pipeline_pid" 2>/dev/null; do
              snapshot pipeline "$pipeline_pid"
              sleep 2
            done
          ) &
          monitor_pid=$!
          if wait "$pipeline_pid"; then
            pipeline_status=0
          else
            pipeline_status=$?
          fi
          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true
          snapshot after_pipeline "$pipeline_pid"
          exit "$pipeline_status"
      - name: Validate terminal, stages, and production-default media contract
        working-directory: pipeline
        run: |
          job_id=$(python3 -c 'import json; events=[json.loads(line) for line in open("../model-e2e.jsonl") if line.lstrip().startswith("{")]; print(next(event["job_id"] for event in reversed(events) if event.get("event")=="terminal"))')
          job_dir="$CLIPGAUGE_HOME/jobs/$job_id"
          test -d "$job_dir"
          validator="$RUNNER_TEMP/validate-model-e2e.py"
          git show "$GITHUB_SHA:scripts/validate-model-e2e.py" > "$validator"
          uv run python "$validator" ../model-e2e.jsonl "$job_dir" "$job_dir/clips/clip_00.mp4" > ../model-e2e-summary.json
          printf 'job_id=%s\n' "$job_id" > ../model-e2e-job.txt
      - name: Upload model E2E diagnostics
        if: always()
        id: model-e2e-diagnostics
        shell: bash
        run: |
          set +e
          diagnostics_dir="$GITHUB_WORKSPACE/model-e2e-diagnostics"
          mkdir -p "$diagnostics_dir"
          for file in model-e2e.jsonl setup-asr.jsonl setup-analysis.jsonl setup-runtime.jsonl setup-model.jsonl model-e2e-memory.log; do
            if [ -f "$GITHUB_WORKSPACE/$file" ]; then
              cp "$GITHUB_WORKSPACE/$file" "$diagnostics_dir/"
            fi
          done
          for file in local-runtime.jsonl local-runtime.stderr.log; do
            if [ -f "$CLIPGAUGE_HOME/diagnostics/$file" ]; then
              cp "$CLIPGAUGE_HOME/diagnostics/$file" "$diagnostics_dir/"
            fi
          done
          : > "$diagnostics_dir/model-e2e-job.txt"
          if [ -f "$GITHUB_WORKSPACE/model-e2e.jsonl" ]; then
            python3 -c 'import json; events=[json.loads(line) for line in open("model-e2e.jsonl") if line.lstrip().startswith("{")]; ids=[event.get("job_id") for event in reversed(events) if event.get("event")=="terminal" or event.get("event")=="job"]; print(next((item for item in ids if item), ""))' > "$diagnostics_dir/model-e2e-job.txt"
          fi
          job_id=$(tr -d '\r\n' < "$diagnostics_dir/model-e2e-job.txt" 2>/dev/null)
          if [ -n "$job_id" ] && [ -d "$CLIPGAUGE_HOME/jobs/$job_id/diagnostics" ]; then
            cp -R "$CLIPGAUGE_HOME/jobs/$job_id/diagnostics" "$diagnostics_dir/job-diagnostics"
          fi
          {
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'workflow_run=%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_sha=%s\n' "$GITHUB_SHA"
            printf 'job_id=%s\n' "$job_id"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'python=%s\n' "$(python3 --version 2>&1)"
            printf 'ffmpeg=%s\n' "$(ffmpeg -version 2>/dev/null | head -n 1)"
          } > "$diagnostics_dir/failure-summary.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clipgauge-model-e2e-diagnostics-${{ github.sha }}
          path: model-e2e-diagnostics
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: clipgauge-model-e2e-${{ github.sha }}
          path: |
            model-e2e.jsonl
            model-e2e-summary.json
            model-e2e-job.txt
            setup-asr.jsonl
            setup-analysis.jsonl
            setup-runtime.jsonl
            setup-model.jsonl
            e2e-input/v041-controlled.mp4
          if-no-files-found: error
          retention-days: 14

  release-metadata:
    name: Generate and validate release metadata
    needs: [validate-tag, linux-release, windows-release, macos-release, model-e2e-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: clipgauge-linux-${{ github.sha }}
          path: release-inputs/linux
      - uses: actions/download-artifact@v4
        with:
          name: clipgauge-windows-${{ github.sha }}
          path: release-inputs/windows
      - uses: actions/download-artifact@v4
        with:
          name: clipgauge-model-e2e-${{ github.sha }}
          path: release-inputs/model-e2e
      - name: Normalize release inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-inputs/linux -maxdepth 1 -type f -name 'ClipGauge_*.deb' -exec cp {} release-assets/ \;
          find release-inputs/windows -maxdepth 1 -type f -name 'ClipGauge_*.exe' -exec cp {} release-assets/ \;
          cp release-inputs/model-e2e/model-e2e-summary.json release-assets/MODEL_E2E_SUMMARY.json
          test "$(find release-assets -maxdepth 1 -type f \( -name '*.deb' -o -name '*.exe' \) | wc -l)" -eq 2
          test -s release-assets/MODEL_E2E_SUMMARY.json
      - name: Generate CycloneDX SBOM
        run: python3 scripts/generate-release-metadata.py --tag "$RELEASE_TAG" --output-dir release-assets
      - name: Validate CycloneDX SBOM
        run: python3 scripts/validate-sbom.py release-assets/SBOM.cyclonedx.json --tag "$RELEASE_TAG"
      - name: Generate GitHub build provenance attestation
        id: attest
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/ClipGauge_*.deb
            release-assets/ClipGauge_*.exe
            release-assets/SBOM.cyclonedx.json
      - name: Record attestation result without overclaiming
        shell: bash
        run: |
          if [ "${{ steps.attest.outcome }}" = "success" ]; then
            printf '%s\n' '# GitHub Attestation Status' '' 'Build provenance attestation: generated by GitHub Actions for the release subjects.' > release-assets/ATTESTATION_STATUS.md
          else
            printf '%s\n' '# GitHub Attestation Status' '' 'Build provenance attestation: unavailable in this repository/account execution; no cryptographic attestation success is claimed.' > release-assets/ATTESTATION_STATUS.md
          fi
      - name: Generate human-readable provenance
        run: |
          python3 scripts/generate-release-metadata.py \
            --tag "$RELEASE_TAG" \
            --output-dir release-assets \
            --workflow-run "$GITHUB_RUN_ID" \
            --attestation-status "$(tr '\n' ' ' < release-assets/ATTESTATION_STATUS.md)"
      - name: Generate release notes
        working-directory: release-assets
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## ClipGauge ${RELEASE_TAG}

          ClipGauge ${RELEASE_TAG} delivers the qualified v0.6.0 creator capability suite.

          - External SRT and WebVTT subtitles can be supplied during ingest and reused by captioned renders.
          - Content profiles guide Auto, Knowledge, and Entertainment enrichment.
          - Validated finalist evidence supports publishing title and description generation.
          - Users can edit, save, reset, and persist clip titles across rerenders and restarts.
          - Smart collections use an optional provider-assisted path with an explicit privacy boundary; invalid or unavailable provider output uses deterministic fallback grouping.
          - Manual collections support create, rename, add, remove, reorder, render, playback, and delete.
          - Optional loopback-first FastAPI serving and persistent MCP tools expose headless job and collection operations.
          - Docker packages the headless service as a non-root container with persistent storage.
          - Bilibili public-link ingestion remains best effort and environmentally dependent.
          - Native creator, playback, export, persistence, and 125% Windows DPI qualification passed on the exact tag.
          - Linux amd64 Debian and Windows x64 NSIS artifacts are unsigned.
          - Native macOS ARM and Intel builds are qualification results; no signing or notarization is claimed.
          - The exact-tag publication is gated by a real managed-model E2E using the production-default captioned 1080x1920 render path; its summary is attached as \`MODEL_E2E_SUMMARY.json\`.
          - The current headless Docker image is approximately 9.0 GB.
          - The CycloneDX SBOM, checksums, and provenance are generated from the immutable ${RELEASE_TAG} tag.
          - \`SHA256SUMS\`, \`RELEASE_PROVENANCE.md\`, and \`ATTESTATION_STATUS.md\` describe exact assets, metadata, GitHub attestations, and signing status.
          - AGPL-3.0-or-later licensing and upstream publikclip attribution remain preserved.

          Known limitations:

          - Bilibili ingestion may fail when upstream yt-dlp or site compatibility changes.
          - The Docker image is approximately 9.0 GB.
          EOF
      - name: Generate checksums from exact final release assets
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum ClipGauge_*.deb ClipGauge_*.exe SBOM.cyclonedx.json MODEL_E2E_SUMMARY.json RELEASE_PROVENANCE.md ATTESTATION_STATUS.md > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: clipgauge-release-assets-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  release-publish:
    name: Publish draft-first GitHub release
    needs: [validate-tag, linux-release, windows-release, macos-release, model-e2e-release, release-metadata]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clipgauge-release-assets-${{ github.sha }}
          path: release-assets
      - name: Verify release inputs before publication
        working-directory: release-assets
        run: |
          set -euo pipefail
          test -f "ClipGauge_${RELEASE_TAG#v}_amd64.deb"
          test -f "ClipGauge_${RELEASE_TAG#v}_Windows_x64_NSIS.exe"
          test -f SBOM.cyclonedx.json
          test -f RELEASE_PROVENANCE.md
          test -f ATTESTATION_STATUS.md
          test -f MODEL_E2E_SUMMARY.json
          sha256sum -c SHA256SUMS
      - name: Create complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to replace it" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "ClipGauge $RELEASE_TAG" \
            --notes-file release-assets/RELEASE_NOTES.md \
            release-assets/ClipGauge_*.deb \
            release-assets/ClipGauge_*.exe \
            release-assets/SHA256SUMS \
            release-assets/SBOM.cyclonedx.json \
            release-assets/MODEL_E2E_SUMMARY.json \
            release-assets/RELEASE_PROVENANCE.md \
            release-assets/ATTESTATION_STATUS.md
      - name: Verify draft assets then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_count=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          test "$asset_count" -eq 7
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
