name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for render smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install environment
        working-directory: pipeline
        run: uv sync --dev
      - name: Run pytest
        working-directory: pipeline
        run: uv run pytest -q

  frontend:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Typecheck and build
        working-directory: app
        run: npm run build
      - name: Run Vitest
        working-directory: app
        run: npm test

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check authoritative release versions
        run: python3 scripts/check-version-consistency.py

  rust:
    name: Rust format, tests, and clippy
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Prepare Tauri resource directory for Rust checks
        run: mkdir -p resources
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run tests
        run: cargo test
      - name: Run clippy with warnings denied except widened Tauri command signatures
        # Provider-aware commands intentionally carry explicit provider configuration and vault handles.
        run: cargo clippy -- -D warnings -A clippy::too_many_arguments -A dead_code
