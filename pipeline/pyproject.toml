[project]
name = "clipgauge-pipeline"
version = "0.5.8"
description = "ClipGauge — local AI video clipper"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "librosa>=0.10",
    "numba>=0.60",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "python-speech-features>=0.6",
    "scenedetect>=0.6.4",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "speechbrain>=1.0",
    "torchlibrosa>=0.1.0",
    # Keep the locked Torch stack direct so Windows uses the CUDA index.
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "whisperx==3.8.6",
]

[project.scripts]
clipgauge = "clipgauge_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["clipgauge_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that exercise longer media or render paths"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
